<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fond photo réaliste de tuyauterie moderne">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a29"/>
      <stop offset="1" stop-color="#26384c"/>
    </linearGradient>
    <linearGradient id="steelH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#667788"/>
      <stop offset="0.2" stop-color="#dce5ec"/>
      <stop offset="0.5" stop-color="#9aabba"/>
      <stop offset="0.8" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#657585"/>
    </linearGradient>
    <linearGradient id="steelV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#667788"/>
      <stop offset="0.2" stop-color="#dce5ec"/>
      <stop offset="0.5" stop-color="#9aabba"/>
      <stop offset="0.8" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#657585"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.03"/>
      </feComponentTransfer>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#room)"/>
  <rect width="1600" height="900" filter="url(#grain)" fill="#fff" opacity="0.5"/>

  <g opacity="0.35" filter="url(#soft)">
    <circle cx="260" cy="180" r="170" fill="#26c6da"/>
    <circle cx="1320" cy="720" r="220" fill="#1abc9c"/>
  </g>

  <g>
    <rect x="0" y="175" width="1600" height="42" rx="21" fill="url(#steelH)"/>
    <rect x="0" y="425" width="1600" height="42" rx="21" fill="url(#steelH)"/>
    <rect x="0" y="675" width="1600" height="42" rx="21" fill="url(#steelH)"/>

    <rect x="245" y="0" width="38" height="900" rx="19" fill="url(#steelV)"/>
    <rect x="748" y="0" width="38" height="900" rx="19" fill="url(#steelV)"/>
    <rect x="1248" y="0" width="38" height="900" rx="19" fill="url(#steelV)"/>
  </g>

  <g>
    <circle cx="264" cy="196" r="24" fill="#f59e0b" stroke="#ffd68a" stroke-width="3"/>
    <circle cx="767" cy="446" r="24" fill="#f59e0b" stroke="#ffd68a" stroke-width="3"/>
    <circle cx="1267" cy="696" r="24" fill="#f59e0b" stroke="#ffd68a" stroke-width="3"/>
  </g>

  <rect width="1600" height="900" fill="#0b1220" opacity="0.18"/>
</svg>
